workflows:
  android-build:
    name: 堅棟堅企 Android APK
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate modern Android project
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          rm -rf /tmp/modern_flutter_android

          flutter create \
            --platforms=android \
            --org com.jiandongjianqi \
            --project-name batch_photo_tools \
            /tmp/modern_flutter_android

          rm -rf "$CM_BUILD_DIR/android"
          cp -R /tmp/modern_flutter_android/android "$CM_BUILD_DIR/android"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace(
              'android:label="${applicationName}"',
              'android:label="@string/app_name"'
          )
          text = text.replace(
              'android:label="batch_photo_tools"',
              'android:label="@string/app_name"'
          )
          manifest.write_text(text, encoding="utf-8")

          strings = Path("android/app/src/main/res/values/strings.xml")
          strings.parent.mkdir(parents=True, exist_ok=True)
          strings.write_text(
              '<resources>\n'
              '    <string name="app_name">堅棟堅企</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )
          PY

          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name "MainActivity.kt" -print -quit)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi
          grep -q "FlutterActivity" "$MAIN_ACTIVITY"

          ICON="$CM_BUILD_DIR/assets/icon/app_icon.png"
          if [ -f "$ICON" ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$density"
              cp "$ICON" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
              cp "$ICON" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            done
          else
            echo "WARNING: app_icon.png not found; using default icon."
          fi

      - name: Get Flutter packages
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          test -f pubspec.yaml
          flutter pub get

      - name: Analyze Flutter project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter analyze

      - name: Build Android APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
