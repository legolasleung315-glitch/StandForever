name: batch_photo_tools
description: Batch photo processing tool for Android.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.1.0
  image: 4.9.1
  intl: 0.20.2
  shared_preferences: 2.3.2
  image_gallery_saver_plus: 5.1.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
